services:
  agent-orchestrator-rpg-sdl:
    image: emils-nuc-server:5000/agent-orchestrator-cpp:latest
    container_name: agent-orchestrator-rpg-sdl
    restart: unless-stopped
    cpuset: "0-5"
    cpus: 6.0
    mem_limit: 12g
    pids_limit: 2048
    env_file: ./stack.env
    environment:
      RPG_BUILD_JOBS: "6"
    command:
      - /bin/sh
      - -c
      - |
        gh auth setup-git
        exec node dist/main.js
    configs:
      - source: agent-orchestrator-rpg-sdl-config
        target: /opt/agent-orchestrator/config.yaml
    volumes:
      - agent-orchestrator-rpg-sdl-repository-volume:/opt/repositories
      - agent-orchestrator-rpg-sdl-worktrees-volume:/opt/.agent-worktrees/rpg-sdl
      - agent-orchestrator-rpg-sdl-logs-volume:/opt/agent-orchestrator/logs
      - /home/emilhornlund/.config/opencode:/root/.config/opencode
      - /home/emilhornlund/.local/share/opencode:/root/.local/share/opencode
      - /home/emilhornlund/.config/agent-orchestrator/signing/id_ed25519:/run/secrets/agent-orchestrator-signing-key:ro
    networks:
      - isolated

configs:
  agent-orchestrator-rpg-sdl-config:
    content: |
      projects:
        - id: "rpg-sdl"
          trello:
            boardId: "6a183eaa979adc3c79bd095f"
            backlogListId: "6a183eb0b8087f286160577a"
            readyListId: "6a886de923d8201c8dc6354f"
            workingListId: "6a251e0aeeb9b58703aec548"
            reviewListId: "6a886df67ee6877566c27b42"
            failedListId: "6a88a3a78bd625f1bbfcc90e"
            doneListId: "6a251e1069b2e1a737e5552a"
            refinementLabelId: "6a8b2f7d324bb011aa3e1502"
            featureLabelId: "6a183ead96b4721a28f71df9"
            improvementLabelId: "6a183eaa05b59721b6e4548f"
            bugLabelId: "6a183eadf4dd539542c3c8be"
          repository:
            path: "/opt/repositories/rpg-sdl"
            github: "emilhornlund/rpg-sdl"
            defaultBranch: "main"
            worktreeRoot: "/opt/.agent-worktrees/rpg-sdl"
            gitIdentity:
              name: "Emil Hörnlund"
              email: "10013373+emilhornlund@users.noreply.github.com"
              signingKey: "/run/secrets/agent-orchestrator-signing-key"
          opencode:
            timeoutMinutes: 360
            refinement:
              model: "openai/gpt-5.6-luna"
              variant: "xhigh"
            implementation:
              model: "openai/gpt-5.6-luna"
              variant: "xhigh"
            review:
              model: "openai/gpt-5.6-luna"
              variant: "high"
            remediation:
              model: "openai/gpt-5.6-luna"
              variant: "xhigh"
            commit:
              model: "openai/gpt-5.6-luna"
              variant: "medium"
      workflow:
        pollIntervalSeconds: 15

volumes:
  agent-orchestrator-rpg-sdl-repository-volume:
    name: agent-orchestrator-rpg-sdl-repository-volume
  agent-orchestrator-rpg-sdl-worktrees-volume:
    name: agent-orchestrator-rpg-sdl-worktrees-volume
  agent-orchestrator-rpg-sdl-logs-volume:
    name: agent-orchestrator-rpg-sdl-logs-volume

networks:
  isolated:
    driver: bridge
